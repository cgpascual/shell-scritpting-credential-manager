name: Credential Manager CI

on:
  push:
    branches:
      - main
      - dev
      - feature/**

  pull_request:
    branches:
      - main
      - dev

jobs:

  bash-tests:
    name: Run Bash Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run Bash tests
        run: |
          bats tests/bash

  docker-tests:
    name: Build and Test Docker
    needs: bash-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Build Docker image
        run: |
          docker build -t credential-manager:0.0.1 .

      - name: Run Docker tests
        run: |
          bats tests/docker